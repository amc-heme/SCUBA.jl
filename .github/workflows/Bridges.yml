name: Bridges
# Extension tests: Zarr.jl, PythonCall (anndata), RCall (SeuratObject, SingleCellExperiment, HDF5Array, BPCells).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
jobs:
  bridges:
    name: bridges - ${{ matrix.os }} - py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install "anndata>=0.11" mudata zarr scipy pandas numpy
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://bnprks.r-universe.dev   # BPCells binaries
      # BPCells links against the system HDF5 on Linux (r-universe binary or source build)
      - name: System HDF5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      # pak: RSPM / Bioconductor binaries, BPCells binaries from r-universe, apt system requirements.
      # Hard dependencies only: the default ("all") also installs Suggests, which pulled in
      # alabaster.* source builds that fail to link on macOS.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::Seurat
            any::jsonlite
            bioc::SingleCellExperiment
            bioc::HDF5Array
            any::BPCells
          cache-version: 2
      - uses: julia-actions/julia-buildpkg@v1
      - name: R / RCall diagnostics (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          julia -e 'using Pkg; Pkg.activate("/tmp/rc"); Pkg.add("RCall")' > /dev/null 2>&1
          sudo apt-get install -y -qq strace > /dev/null
          T='using RCall; println("R says: ", rcopy(R"1+1"))'
          echo "== A: plain"
          julia --project=/tmp/rc -e "$T" 2>&1 | tail -15; echo "exit=${PIPESTATUS[0]}"
          echo "== B: LD_PRELOAD system libstdc++ / libgfortran"
          LD_PRELOAD=/lib/x86_64-linux-gnu/libstdc++.so.6:/lib/x86_64-linux-gnu/libgfortran.so.5 julia --project=/tmp/rc -e "$T" 2>&1 | tail -15; echo "exit=${PIPESTATUS[0]}"
          echo "== C: no LD_LIBRARY_PATH"
          env -u LD_LIBRARY_PATH julia --project=/tmp/rc -e "$T" 2>&1 | tail -15; echo "exit=${PIPESTATUS[0]}"
          echo "== strace (plain)"
          strace -f -e trace=exit_group,openat,write -s 200 -o /tmp/st.txt julia --project=/tmp/rc -e "$T" > /dev/null 2>&1 || true
          grep -nE 'exit_group' /tmp/st.txt | head -5
          grep -E 'openat.*(libR|Rblas|Rlapack|libstdc|gfortran|openblas)' /tmp/st.txt | tail -12
          grep -E 'write\(2,' /tmp/st.txt | tail -15
      - name: RCall smoke test (diagnostic)
        continue-on-error: true
        run: julia -e 'using Pkg; Pkg.activate(temp = true); Pkg.add("RCall"); using RCall; println(rcopy(R"R.version.string")); println(rcopy(R"as.character(packageVersion(\"SeuratObject\"))"))'
      # Separate processes: libR and libpython are not loaded into the same Julia process.
      - name: Run Zarr + PythonCall bridge tests
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["bridges", "only=zarr,pythoncall"])'
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: python
      - name: Run RCall bridge tests
        if: success() || failure()
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["bridges", "only=rcall"])'
